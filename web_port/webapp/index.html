<!DOCTYPE html>
<html>
<head>
    <title>Desmos WebAssembly Port Showcase</title>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f0f0f0; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        .header { 
            background: #222; 
            color: white; 
            display: flex; 
            align-items: center; 
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        h1 { 
            font-size: 18px; 
            margin-right: 40px; 
            font-weight: normal;
        }
        .tabs { 
            display: flex; 
            height: 100%; 
        }
        .tab { 
            padding: 15px 25px; 
            cursor: pointer; 
            color: #999; 
            transition: 0.2s; 
            font-weight: bold;
            border-bottom: 3px solid transparent;
        }
        .tab:hover { 
            color: white; 
            background: #333; 
        }
        .tab.active { 
            color: white; 
            background: #444; 
            border-bottom: 3px solid #007bff; 
        }
        .content { 
            flex-grow: 1; 
            position: relative; 
            background: white;
        }
        .section { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
        }
        .section.active { 
            display: block; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: white;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Desmos WASM Demos</h1>
    <div class="tabs">
        <div class="tab active" onclick="showTab(event, 'cardgame')">Blackjack</div>
        <div class="tab" onclick="showTab(event, 'sorting')">Sorting Visualizer</div>
    </div>
</div>

<div class="content">
    <div id="cardgame" class="section active">
        <iframe src="cardgame.html"></iframe>
    </div>

    <div id="sorting" class="section">
        <iframe src="sorter.html"></iframe>
    </div>
</div>

<script>
    function showTab(event, tabId) {
        // Update tabs
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');

        // Update sections
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }
</script>

</body>
</html>
