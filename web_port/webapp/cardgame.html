<!DOCTYPE html>
<html>
<head>
    <title>Blackjack (Card Game)</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: white; }
        button { font-size: 16px; padding: 10px 20px; margin-right: 10px; cursor: pointer; border: none; border-radius: 4px; color: white; background: #2e8b57; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #246d44; }
        #cardgame-container { padding: 10px; }
    </style>
</head>
<body>
    <div id="cardgame-container">Loading Game Engine...</div>
    <script src="assets/cardgame.js"></script>
    <script>
        createCardGameModule().then(Module => {
            window.cardGameModule = Module;
            window.cardGameInstance = new Module.CardGame();
            console.log("CardGame Module Loaded.");
            
            // Load TeaVM UI
            let script = document.createElement("script");
            script.src = "assets/cardgame/app.js";
            script.onload = () => {
                console.log("CardGame TeaVM script loaded.");
                main(); // Invoke TeaVM entry point
            };
            document.body.appendChild(script);
        }).catch(err => {
            console.error(err);
            document.getElementById("cardgame-container").innerHTML = "Failed to load WASM module.";
        });
    </script>
</body>
</html>
